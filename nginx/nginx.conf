events {
    worker_connections 1024;
}

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=reports_cache:100m max_size=1g inactive=7d use_temp_path=off;

    server {
        listen 80;
        server_name cdn.bionicpro.local;

        location /reports/ {
            proxy_cache reports_cache;
            proxy_cache_valid 200 7d;
            proxy_cache_key "$request_uri";
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://minio:9000/bionicpro-reports/;
            proxy_hide_header x-amz-*;
            proxy_hide_header x-amz-meta-*;
        }
    }
}